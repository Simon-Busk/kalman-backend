spring.application.name=kalman-api
server.port=8080

# Session expires after 30 minutes of inactivity
server.servlet.session.timeout=30m

# Pretty-print JSON responses (disable in production for performance)
spring.jackson.serialization.indent-output=true

# Do not accept null values, avoids conversion to 0.
# But cannot give a good response.
spring.jackson.deserialization.fail-on-null-for-primitives=true